version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: stms-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/stms_dev
      - REDIS_URL=redis://redis:6379
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - LOG_LEVEL=debug
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro  # For hot reload in dev (use development target)
    networks:
      - stms-network
    restart: unless-stopped

  # MongoDB
  mongodb:
    image: mongo:7
    container_name: stms-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=stms_dev
    volumes:
      - mongodb_data:/data/db
      - ./src/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - stms-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/stms_dev --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: stms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stms-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Firebase Emulator (for local auth testing)
  firebase:
    image: firebase/firebase-tools:latest
    container_name: stms-firebase
    command: emulators:start --only auth,firestore --project=demo-stms
    ports:
      - "9099:9099"  # Auth
      - "8080:8080"  # Firestore
      - "4000:4000"  # Emulator UI
    environment:
      - FIREBASE_PROJECT_ID=demo-stms
    volumes:
      - ./firebase.json:/firebase.json:ro
      - ./firestore.rules:/firestore.rules:ro
    networks:
      - stms-network
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:

networks:
  stms-network:
    driver: bridge