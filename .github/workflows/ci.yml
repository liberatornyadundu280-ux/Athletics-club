name: STMS CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'stms-backend/**'
      - 'stms-frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'stms-backend/**'
      - 'stms-frontend/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stms-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stms-backend/package-lock.json
      - run: npm ci
      - run: npm run build

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stms-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stms-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
